name: Build JARVIS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Check Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract JARVIS project
        run: |
          rm -rf jarvis-project
          mkdir -p jarvis-project
          unzip -o "jarvis (2).zip" -d jarvis-project

      - name: Show extracted project
        run: |
          echo "========== PROJECT FILES =========="
          find jarvis-project -maxdepth 4 -type f | sort
          echo "==================================="

      - name: Find Android project
        run: |
          echo "========== GRADLE FILES =========="
          find jarvis-project -type f \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -print
          echo "================================="

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/dis
