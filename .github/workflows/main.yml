name: Build JARVIS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract JARVIS
        run: |
          rm -rf jarvis-project
          mkdir jarvis-project
          unzip -q "jarvis (2).zip" -d jarvis-project

      - name: Check project
        run: |
          cd jarvis-project
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Android project found."

      - name: Install Gradle
        run: |
          wget -q
