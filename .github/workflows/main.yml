name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract JARVIS project
        run: |
          mkdir jarvis-project
          unzip -q "jarvis (2).zip" -d jarvis-project

      - name: Check JARVIS project
        working-directory: jarvis-project
        run: |
          echo "Project files:"
          ls -la
          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \( -name "settings.gradle*" -o -name "build.gradle*" -o -name "gradlew" \) -print

      - name: Make Gradle wrapper executable
        working-directory: jarvis-project
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: jarvis-project
        run: ./gradlew --no-daemon assembleDebug

      - name: Find APK
        working-directory: jarvis-project
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: jarvis-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
