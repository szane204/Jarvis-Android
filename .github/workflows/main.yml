name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK paths
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract JARVIS project
        run: |
          mkdir -p jarvis-project
          unzip -q "jarvis (2).zip" -d jarvis-project

      - name: Check JARVIS project
        working-directory: jarvis-project
        run: |
          echo "JARVIS project:"
          ls -la
          echo ""
          echo "Gradle wrapper:"
          ls -la gradlew
          echo ""
          echo "Gradle version:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        working-directory: jarvis-project
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: jarvis-project
        run: ./gradlew --no-daemon assembleDebug

      - name: Find APK
        run: |
          find jarvis-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: jarvis-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
