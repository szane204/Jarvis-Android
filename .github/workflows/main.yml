name: Build JARVIS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Check Android SDK
        run: |
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"
          sdkmanager --version

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract JARVIS project
        run: |
          rm -rf jarvis-project
          mkdir -p jarvis-project
          unzip -q "jarvis (2).zip" -d jarvis-project

      - name: Verify JARVIS project
        run: |
          cd jarvis-project

          echo "Checking project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "JARVIS Android project found successfully."

      - name: Install Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        run: |
          cd jarvis-project
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Check Gradle
        run: |
          cd jarvis-project
          ./gradlew --version

      - name: Build JARVIS debug APK
        run: |
          cd jarvis-project
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        if: always()
        run: |
          echo "Searching for APK..."
          find jarvis-project -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: jarvis-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
