name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract JARVIS project
        run: |
          mkdir -p jarvis-project
          unzip -q "jarvis (2).zip" -d jarvis-project

      - name: Check project structure
        run: |
          echo "JARVIS project files:"
          find jarvis-project -maxdepth 3 -type f | sort

      - name: Install Gradle 9.3.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: jarvis-project
        run: |
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          find jarvis-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: jarvis-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
